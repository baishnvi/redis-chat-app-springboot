spring.application.name=redis-chat-app
server.port=${PORT:8080}

# ---- Redis (override with env vars) ----
# Either set host/port/password ...
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# ... or for a cloud Redis (Upstash/Redis Cloud/Render) set the env var
#     SPRING_DATA_REDIS_URL=rediss://default:<password>@<host>:<port>   (takes precedence)

# ---- Chat settings ----
chat.max-messages-per-room=1000
chat.default-history-limit=10
chat.max-history-limit=100
chat.enforce-membership=true
chat.sse-timeout-ms=1800000

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Actuator ----
management.endpoints.web.exposure.include=health
